<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Wave Gradient 1 -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <!-- Wave Gradient 2 -->
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: 4px;
    }
    .badge-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 1px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      fill: #64748b;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }
    .wave1 { animation: waveMove 12s ease-in-out infinite; }
    .wave2 { animation: waveMove 16s ease-in-out infinite reverse; }
  </style>

  <!-- Background Base with Rounded Corners -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Geometric Grid Background Pattern -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="220" />
    <line x1="250" y1="0" x2="250" y2="220" />
    <line x1="400" y1="0" x2="400" y2="220" />
    <line x1="550" y1="0" x2="550" y2="220" />
    <line x1="700" y1="0" x2="700" y2="220" />
    <line x1="850" y1="0" x2="850" y2="220" />
    <line x1="0" y1="55" x2="900" y2="55" />
    <line x1="0" y1="110" x2="900" y2="110" />
    <line x1="0" y1="165" x2="900" y2="165" />
  </g>

  <!-- Flowing Dynamic Waves -->
  <g class="wave1">
    <path d="M-50 170 Q 180 130, 420 165 T 950 150 L 950 220 L -50 220 Z" fill="url(#waveGrad1)" />
  </g>
  <g class="wave2">
    <path d="M-50 185 Q 220 150, 460 180 T 950 165 L 950 220 L -50 220 Z" fill="url(#waveGrad2)" />
  </g>

  <!-- Terminal Top Badge -->
  <g transform="translate(450, 36)">
    <!-- Pill box -->
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="-118" cy="-1" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-105" y="4" class="badge-text" text-anchor="start">SYSTEM_ONLINE // NEERAJ-2003</text>
  </g>

  <!-- Main Headline Name -->
  <g transform="translate(450, 108)" text-anchor="middle">
    <!-- Subtle glow behind text -->
    <text x="0" y="0" class="title-text" fill="url(#textGrad)" opacity="0.6" filter="url(#glow)">NEERAJ</text>
    <!-- Crisp Foreground Text -->
    <text x="0" y="0" class="title-text" fill="url(#textGrad)">NEERAJ</text>
  </g>

  <!-- Subtitle with Roles -->
  <g transform="translate(450, 146)" text-anchor="middle">
    <text x="0" y="0" class="subtitle-text">Full-Stack Engineer  •  Python &amp; Django  •  ML &amp; Computer Vision</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="165" width="200" height="2" rx="1" fill="url(#textGrad)" opacity="0.7" filter="url(#softGlow)" />

  <!-- Code Tagline -->
  <g transform="translate(450, 188)" text-anchor="middle">
    <text x="0" y="0" class="tagline">while(alive) { innovate(); build(); elevate(); }</text>
  </g>

  <!-- Decorative Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 880 40 L 880 20 L 860 20" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 20 180 L 20 200 L 40 200" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 880 180 L 880 200 L 860 200" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
